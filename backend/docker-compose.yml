services:
  # ── FastAPI Application ───────────────────────────────────────────────────
  api:
    build: .
    container_name: goexpressly_api
    ports:
      - "8000:8000"
    env_file: .env            # All secrets loaded from .env
    depends_on:
      db:
        condition: service_healthy  # Wait for Postgres readiness probe
    restart: unless-stopped

  # ── PostgreSQL Database ───────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: goexpressly_db
    environment:
      POSTGRES_DB: goexpressly
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data   # Persist data across restarts
    ports:
      - "5432:5432"                              # Expose for optional local inspection
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d goexpressly"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
